    <script>
      // Gracefully handle Vite dev HMR WebSockets in Cloud Run proxy environments.
      // Environment rule: "HMR: Disabled. Ignore WebSocket errors."
      (function() {
        if (typeof window === 'undefined') return;
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            var isHmr = false;
            try {
              if (typeof url === 'string' && (url.indexOf('vite') !== -1 || url.indexOf('hmr') !== -1)) isHmr = true;
              if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1)) isHmr = true;
            } catch (e) {}

            if (isHmr) {
              var listeners = {};
              var mock = {
                url: url,
                readyState: 1, // WebSocket.OPEN
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                binaryType: 'blob',
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null,
                addEventListener: function(type, fn) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(fn);
                  if (type === 'open') {
                    setTimeout(function() {
                      try { fn({ type: 'open' }); } catch(err) {}
                    }, 0);
                  }
                },
                removeEventListener: function(type, fn) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                  }
                },
                dispatchEvent: function() { return true; },
                send: function() {},
                close: function() {
                  mock.readyState = 3;
                  var closeEvt = { type: 'close', wasClean: true, code: 1000, reason: 'Normal' };
                  if (typeof mock.onclose === 'function') {
                    try { mock.onclose(closeEvt); } catch(err) {}
                  }
                  if (listeners['close']) {
                    listeners['close'].forEach(function(fn) {
                      try { fn(closeEvt); } catch(err) {}
                    });
                  }
                }
              };
              setTimeout(function() {
                if (typeof mock.onopen === 'function') {
                  try { mock.onopen({ type: 'open' }); } catch(err) {}
                }
              }, 0);
              return mock;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        var origConsoleError = console.error;
        console.error = function() {
          var firstArg = arguments[0];
          if (typeof firstArg === 'string' && (firstArg.indexOf('WebSocket closed without opened') !== -1 || firstArg.indexOf('[vite] connecting...') !== -1)) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };

        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('WebSocket closed without opened') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
